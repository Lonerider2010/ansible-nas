homepage_widgets_yaml:
-   search:
        provider: custom
        showSearchSuggestions: true
        suggestionUrl: https://www.startpage.com/osuggestions?q=
        target: _blank
        url: https://www.startpage.com/do/dsearch?cat=web&language=deutsch&query=
-   greeting:
        text: RaspiNAS
        text_size: xl
-   resources:
        label: CPU
        cpu: true
        cputemp: true
        expanded: true
-   resources:
        label: Memory
        memory: true
        refresh: 60000
        units: metric
        expanded: true
-   resources:
        label: Uptime
        uptime: true
        units: metric
        expanded: true
-   resources:
        label: Systemdisk
        disk: /system
        units: metric
        expanded: true
-   resources:
        label: NASdisk
        disk: /app/config
        units: metric
        expanded: true
-   resources:
        label: Network
        network: true
        units: metric
        expanded: true
-   datetime:
        format:
            dateStyle: short
        locale: de
        text_size: md
-   datetime:
        format:
            timeStyle: short
        locale: de
        text_size: md
