---
# enable or disable the application
homepage_enabled: false
homepage_available_externally: false

# directories
homepage_data_directory: "{{ docker_home }}/homepage"
homepage_icons_directory: "{{ docker_home }}/homepage/icons"

# network
homepage_hostname: "homepage"
homepage_port: "11111"

# docker
homepage_container_name: "homepage"
homepage_image_name: "ghcr.io/gethomepage/homepage"
homepage_image_tag: "latest"

# specs
homepage_memory: "1g"

# settings
homepage_title: RaspiNAS Homepage
homepage_locale: de-DE

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

# Homepage config files - the variables below are formatted to Homepage YAML config files
homepage_settings_yaml:
  language: de-DE
  showStats: true
  title: RaspiNAS Homepage
  layout:
    Monitoring:
      style: row
      columns: 4
    Content Management:
    Media Serving:
    Networking:
    Smart Home/System Tools:
    Local/Projects:
    Open Knowledge:
    DevOps:
    Multimedia:
    Ägyptologie:
      style: row
      columns: 4

homepage_services_yaml:
  - Content Management:
