            icon: calibre
    -   Calibre-web:
            description: Ebook Management
            href: http://192.168.2.181:8084/
            icon: calibre-web
    -   JDownloader2:
            description: Download Management
            href: http://192.168.2.181:5800/
            icon: jdownloader
    -   tinyMediaManager:
            description: Media Meta Management
            href: http://192.168.2.181:4000/
            icon: /icons/tinymm.png
  - Networking:
    -   Router:
            description: Speedport Smart 4
            href: https://192.168.2.1/html/login/index.html
            icon: telekom
    -   Printer:
            description: HP OfficeJet Pro 8024e
            href: http://192.168.2.11/
            icon: hp
    -   Wireshark:
            description: Network monitoring tool
            href: http://192.168.2.181:3000/
            icon: wireshark
  - Smart Home/System Tools:
    -   HomeAssistant:
            description: Smart Home Control
            href: http://192.168.2.181:8123/
            icon: home-assistant
    -   Portainer:
            description: Docker container management
            href: http://192.168.2.181:9000/
            icon: portainer
    -   Pyrobox:
            description: Web-based file manager
            href: http://192.168.2.181:6969/
            icon: /icons/pyrobox.png
    -  Glances:
            description: Cross-platform system monitoring tool
            href: http://192.168.2.181:61208/
            icon: glances

homepage_widgets_yaml:
-   search:
        provider: custom
        url: https://www.startpage.com/do/dsearch?cat=web&language=deutsch&query=
        target: _blank
        suggestionUrl: https://www.startpage.com/osuggestions?q= # Optional
        showSearchSuggestions: true # Optional
-   greeting:
        text: RaspiNAS
        text_size: xl
-   resources:
        cpu: true
        cputemp: true
        memory: true
        refresh: 60000
        units: metric
        uptime: true
-   datetime:
        text_size: md
        locale: de
        format:
            dateStyle: short
-   datetime:
        text_size: md
        locale: de
        format:
            timeStyle: short

