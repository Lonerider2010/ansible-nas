###
### General
###

# Will be added to the docker group to give user command line access to docker
ansible_nas_user: dietmar

# Your email and domain, used for Let's Encrypt SSL certs
ansible_nas_email: Dietmar.Schneider@StartMail.com

# Applications will have subdomain SSL certificates created if Traefik is enabled, e.g. ansible-nas.<your-domain>, nextcloud.<your-domain>
ansible_nas_domain: Schneider.nbg

# What version of python ansible should use on target system (path to spesific binary)
ansible_python_interpreter: /usr/bin/python3


###
### NFS
###
# Data you want published over NFS. More info on the NFS config format can be found at
# https://help.ubuntu.com/community/SettingUpNFSHowTo#Shares
# WARNING: Weird things might happen if you share the same data over Samba and NFS and allow writes on both!

docker_root: /mnt/Volume1/docker

nfs_shares_root: /mnt/Volume1/local

# For Calibre
audiobooks_root: "{{ nfs_shares_root }}/Audiobooks"

# For Calibre
books_root: "{{ nfs_shares_root }}/Books"

# For Calibre
comics_root: "{{ nfs_shares_root }}/Comics"

# For paperless_ng
documents_root: "{{ nfs_shares_root }}/Documents"

# Where stuff downloaded will be stored
download_root: "{{ nfs_shares_root }}/Download"

# Ägyptologie stuff
egyptology_root: "{{ nfs_shares_root}}/Ägyptologie"

# EDV stuff
edv_root: "{{ nfs_shares_root}}/EDV"

# Inventory stuff
inventory_root: "{{ nfs_shares_root}}/Inventar"

# Media stuff
media_root: "{{ nfs_shares_root}}/Media"

# For MiniDLNA
movies_root: "{{ nfs_shares_root}}/Movies"

# For Plex
music_root: "{{ nfs_shares_root}}/Music"

# Orga stuff
orga_root: "{{ nfs_shares_root}}/Organisation"

# Personal stuff
personal_root: "{{ nfs_shares_root}}/Persönliches"

# For Plex
photos_root: "{{ nfs_shares_root}}/Photos"

# For Plex
podcasts_root: "{{ nfs_shares_root}}/Podcasts"

# Versorgung stuff
supply_root: "{{ nfs_shares_root}}/Versorgung"

# For MiniDLNA
tv_root: "{{ nfs_shares_root}}/TV"

nfs_shares:
  - name: books
    comment: "For calibre"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ books_root }}"

  - name: audiobooks
    comment: "For Plex"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ audiobooks_root }}"

  - name: comics
    comment: "For calibre"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ comics_root }}"

  - name: documents
    comment: "For paperless_ng"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ documents_root }}"

  - name: downloads
    comment: "Stuff downloaded"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ download_root }}"

  - name: egyptology
    comment: "Ägyptologie stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ egyptology_root }}"

  - name: Inventar
    comment: "Inventar stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ inventory_root }}"

  - name: IT
    comment: "IT stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ it_root }}"

  - name: Media
    comment: "Media stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ media_root }}"

  - name: Movies
    comment: "For MiniDLNA"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ movies_root }}"

  - name: Music
    comment: "For Plex"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ music_root }}"

  - name: Organisation
    comment: "Organisation stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ orga_root }}"

  - name: Persönliches
    comment: "Persönliches stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ personal_root }}"

  - name: Photos
    comment: "For Plex"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ photos_root }}"

  - name: Podcasts
    comment: "For Plex"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ podcasts_root }}"

  - name: TV
    comment: "For MiniDLNA"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ tv_root }}"

  - name: Versorgung
    comment: "Versorgung stuff"
    guest_ok: yes
    public: yes
    writable: yes
    browseable: yes
    path: "{{ supply_root }}"

nfs_exports:
  - "{{ books_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ audiobooks_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ comics_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ docker_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ download_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ documents_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ egyptology_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ inventory_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ it_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ media_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ movies_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ music_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ orga_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ personal_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ photos_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ podcasts_root }} *(rw,async,no_root_squash,no_subtree_check)"
  - "{{ supply_root }} *(rw,async,no_root_squash,no_subtree_check)"
